# Testo del report.html. Modifica solo questo file per cambiare parole/numeri:
# la struttura/stile della pagina vive in build_cv_report.py e non va toccata qui.

eyebrow: "Lorenzo Meneghetti — Basket Analytics"
title: "Il pace nel basket femminile italiano"

intro: |
  Quanto corrono le squadre di Serie A1? Ho raccolto i tabellini di tutte le 110 partite
  della regular season 2025/26 da
  <a href="https://www.legabasketfemminile.it">legabasketfemminile.it</a> e calcolato il
  <strong>pace</strong> — i possessi giocati ogni 40 minuti — di ogni partita, con la
  formula di Dean&nbsp;Oliver
  (<a href="https://hackastat.eu/learn-a-stat-possessi-e-pace/">hackastat.eu</a>).

sections:
  - chip: "01 — CLASSIFICA RITMO"
    heading: "Chi corre e chi no"
    caption: |
      Quasi sei possessi a partita separano la squadra più veloce dalla più lenta:
      Roseto corre, San Giovanni preferisce giocare a metà campo. Le due finaliste
      sono agli opposti: Venezia tra le più veloci, Schio nella metà lenta.
    layout: single
    image: bar
    alt: "Pace medio per squadra"

  - chip: "02 — CASO DI STUDIO: LE DUE FINALISTE"
    heading: "Schio e Venezia, partita per partita"
    caption: |
      Schio ha chiuso la regular season 20-0 giocando quasi sempre sotto la media del
      campionato. Venezia vive sopra. Ma nessuna delle due ha un ritmo fisso: da una
      serata all'altra si passa da 65 a quasi 80 possessi.
    layout: pair
    pair:
      - label: "Schio"
        image: timeline_schio
        alt: "Pace per partita di Schio nel corso della stagione"
      - label: "Venezia"
        image: timeline_venezia
        alt: "Pace per partita di Venezia nel corso della stagione"

  - chip: "03 — CASO DI STUDIO: LE DUE FINALISTE"
    heading: "Chi impone il ritmo"
    caption: |
      Ogni punto è una partita, letta rispetto al ritmo abituale delle due squadre in
      campo. Schio le partite le rallenta e le porta sul suo passo: anche quando corre
      meno del solito, l'avversaria corre ancora meno. Venezia fa l'opposto, le
      accelera e ha perso quasi solo nelle serate in cui il ritmo è sceso.
    layout: pair
    pair:
      - label: "Schio"
        image: deviation_schio
        alt: "Scostamento dal pace medio, Schio vs avversaria"
      - label: "Venezia"
        image: deviation_venezia
        alt: "Scostamento dal pace medio, Venezia vs avversaria"

  - chip: "04 — COM'È FINITA"
    heading: "La finale si è giocata sul passo di Schio"
    caption: |
      Tutte e tre le gare della serie sono andate in scena sotto il ritmo medio di stagione. 
      Venezia ha vinto Gara 1 ma poi Schio ha chiuso 2-1 giocando sul proprio passo.
      Chi ha imposto il ritmo ha vinto lo scudetto.
    layout: single
    image: finali
    alt: "Pace nelle 3 partite della finale Schio-Venezia"

footer:
  - "Fonte dati: legabasketfemminile.it, Serie A1 femminile 2025/26 (regular season). Formula del pace: hackastat.eu."
  - "Scraping, calcolo e visualizzazioni realizzati in Python."