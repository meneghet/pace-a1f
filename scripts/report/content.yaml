# Testo del report_cv.html. Modifica solo questo file per cambiare parole/numeri:
# la struttura/stile della pagina vive in build_cv_report.py e non va toccata qui.

eyebrow: "Progetto personale — analisi dati sportivi"
title: "Il pace nel basket femminile italiano"

intro: |
  Ho scaricato i tabellini di tutte le 110 partite della regular season di Serie A1 2025/26
  da <a href="https://www.legabasketfemminile.it">legabasketfemminile.it</a> e calcolato il
  <strong>pace</strong> (possessi stimati ogni 40 minuti) di ogni squadra partita per partita,
  con la formula avanzata di Dean&nbsp;Oliver descritta su
  <a href="https://hackastat.eu/learn-a-stat-possessi-e-pace/">hackastat.eu</a>.

sections:
  - chip: "01 — CLASSIFICA RITMO"
    heading: "Pace medio per squadra"
    caption: |
      Chi corre più delle altre in tutta la Serie A1. Roseto gioca il basket più
      veloce, Broni e San Giovanni il più lento — quasi 6 possessi a partita di differenza.
    layout: single
    image: bar
    alt: "Pace medio per squadra"

  - chip: "02 — CASO DI STUDIO: LE DUE FINALISTE"
    heading: "Il ritmo di Schio e Venezia, partita per partita"
    caption: |
      Le due squadre arrivate in finale. Schio (20-0 in regular season) oscilla molto, da 65 a
      quasi 80; Venezia è leggermente più veloce in media e altrettanto incostante.
    layout: pair
    pair:
      - label: "Schio"
        image: timeline_schio
        alt: "Pace per partita di Schio nel corso della stagione"
      - label: "Venezia"
        image: timeline_venezia
        alt: "Pace per partita di Venezia nel corso della stagione"

  - chip: "03 — CASO DI STUDIO: LE DUE FINALISTE"
    heading: "Chi si scosta dal proprio ritmo abituale"
    caption: |
      Ogni punto è una partita: sulla x quanto la squadra si è scostata dal proprio pace medio
      stagionale, sulla y quanto l'avversaria si è scostata dal proprio. Origine (0,0) =
      entrambe al ritmo abituale. Schio rallenta le partite e le porta sul proprio ritmo: anche
      nelle gare sotto la propria media, l'avversaria scende ancora di più sotto la sua. Venezia
      fa l'opposto: accelera le partite sul proprio ritmo. Le sue sconfitte principali sono
      arrivate proprio quando il ritmo è calato sotto la sua media.
    layout: pair
    pair:
      - label: "Schio"
        image: deviation_schio
        alt: "Scostamento dal pace medio, Schio vs avversaria"
      - label: "Venezia"
        image: deviation_venezia
        alt: "Scostamento dal pace medio, Venezia vs avversaria"

  - chip: "04 — COM'È FINITA"
    heading: "Il pace nella finale scudetto"
    caption: |
      Venezia elimina Schio (unica sconfitta stagionale) in Gara 1, sul ritmo più lento delle tre
      partite — sotto la media stagionale di entrambe. Schio chiude la serie 2-1 vincendo Gara 2 e
      Gara 3 su un pace vicino al proprio standard, ma sempre più lento di quello abituale di
      Venezia: la finale si è giocata su ritmi imposti da Schio, non da Venezia.
    layout: single
    image: finali
    alt: "Pace nelle 3 partite della finale Schio-Venezia"

footer:
  - "Fonte dati: legabasketfemminile.it, Serie A1 femminile 2025/26 (regular season). Formula del pace: hackastat.eu."
  - "Scraping, calcolo e visualizzazioni realizzati con Python (requests, BeautifulSoup, pandas, matplotlib/seaborn)."
